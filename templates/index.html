<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全球达人情报系统</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CI</div>
        <div>
          <div class="brand-title" data-i18n="brand.title">全球达人情报系统</div>
          <div class="brand-subtitle" id="sidebar-project-name" data-i18n="brand.subtitle">Global Creator Intelligence</div>
        </div>
      </div>

      <nav class="nav-list" id="sidebar-nav">
        <button class="nav-item is-active" data-page="overview">
          <i data-lucide="layout-dashboard"></i>
          <span data-i18n="nav.overview">概览</span>
        </button>
        <button class="nav-item" data-page="creators">
          <i data-lucide="database"></i>
          <span data-i18n="nav.creators">达人库</span>
        </button>
        <button class="nav-item" data-page="groups">
          <i data-lucide="folder-heart"></i>
          <span>达人分组</span>
        </button>
        <button class="nav-item" data-page="ai">
          <i data-lucide="sparkles"></i>
          <span data-i18n="nav.ai">AI复核</span>
        </button>
        <button class="nav-item" data-page="import">
          <i data-lucide="upload"></i>
          <span data-i18n="nav.import">数据导入</span>
        </button>
        <button class="nav-item" data-page="batch-compare">
          <i data-lucide="columns-3"></i>
          <span>批次对比</span>
        </button>
        <button class="nav-item" data-page="outreach">
          <i data-lucide="mail"></i>
          <span data-i18n="nav.outreach">邮件触达</span>
        </button>
        <button class="nav-item" data-page="exports">
          <i data-lucide="file-down"></i>
          <span data-i18n="nav.exports">数据与导出</span>
        </button>
        <button class="nav-item" data-page="rules">
          <i data-lucide="sliders-horizontal"></i>
          <span data-i18n="nav.rules">规则设置</span>
        </button>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="toolbar-meta">
          <div class="toolbar-chip">
            <span class="toolbar-label" data-i18n="toolbar.country">当前国家/地区</span>
            <strong id="toolbar-country">全球</strong>
          </div>
          <div class="toolbar-chip">
            <span class="toolbar-label" data-i18n="toolbar.platform">当前平台</span>
            <strong id="toolbar-platform">小红书</strong>
          </div>
          <div class="toolbar-chip">
            <span class="toolbar-label" data-i18n="toolbar.updated">数据更新时间</span>
            <strong id="toolbar-updated">-</strong>
          </div>
          <div class="toolbar-chip" id="batch-selector-chip" style="display:none">
            <span class="toolbar-label" data-i18n="toolbar.batch">当前批次</span>
            <select id="batch-selector" class="batch-select">
              <option value="">默认案例批次</option>
            </select>
            <button id="batch-manager-btn" class="batch-manager-btn" title="管理批次" data-i18n-title="batch.manage">&#9881;</button>
          </div>
        </div>

        <div class="toolbar-actions">
          <label class="global-search">
            <i data-lucide="search"></i>
            <input id="global-search" type="search" data-i18n-placeholder="toolbar.searchPlaceholder" placeholder="搜索昵称 / 关键词">
          </label>
          <div class="lang-switch" id="lang-switch">
            <button class="lang-btn" data-locale="zh-CN">中文</button>
            <button class="lang-btn" data-locale="en">EN</button>
            <button class="lang-btn" data-locale="ko">한국어</button>
          </div>
          <div class="project-pill">
            <i data-lucide="badge-info"></i>
            <span id="toolbar-project-name" data-i18n="project.name">K-Brand Demo</span>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div id="app-status" class="page-status hidden"></div>

        <section class="page-section is-active" id="page-overview"></section>
        <section class="page-section" id="page-creators"></section>
        <section class="page-section" id="page-groups"></section>
        <section class="page-section" id="page-ai"></section>
        <section class="page-section" id="page-import"></section>
        <section class="page-section" id="page-batch-compare"></section>
        <section class="page-section" id="page-outreach"></section>
        <section class="page-section" id="page-exports"></section>
        <section class="page-section" id="page-rules"></section>
      </main>
    </div>
  </div>

  <div class="drawer-overlay hidden" id="drawer-overlay"></div>
  <aside class="detail-drawer" id="detail-drawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <div class="drawer-kicker" data-i18n="drawer.title">达人详情</div>
        <h2 id="drawer-name">-</h2>
      </div>
      <button class="icon-btn" id="drawer-close" aria-label="关闭详情" data-i18n-aria-label="drawer.close">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="drawer-tabs" id="drawer-tabs"></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script>
    window.APP_VERSION = "{{ app_version }}";
  </script>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  <div id="batch-manager-modal" class="bm-overlay" style="display:none">
    <div class="bm-panel">
      <div class="bm-header">
        <h3 data-i18n="batch.manageTitle">批次管理</h3>
        <button class="bm-close" id="bm-close">&times;</button>
      </div>
      <div class="bm-list" id="bm-list"></div>
      <div class="bm-footer" id="bm-footer"></div>
    </div>
  </div>

  <!-- Task Progress Overlay -->
  <div class="task-progress-overlay" id="task-progress-overlay">
    <div class="task-progress-box">
      <div class="task-progress-title">AI Review Progress</div>
      <div class="task-progress-track"><div class="task-progress-bar" id="task-progress-bar"></div></div>
      <div class="task-progress-text" id="task-progress-text">0/0 - pending</div>
    </div>
  </div>
</body>
</html>
