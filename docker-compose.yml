services:
  postgres:
    image: postgres:16-alpine
    container_name: kcs-postgres
    environment:
      POSTGRES_USER: kcs
      POSTGRES_PASSWORD: kcs
      POSTGRES_DB: kcs
    ports:
      - "5432:5432"
    volumes:
      - kcs_pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcs -d kcs"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: kcs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kcsminio
      MINIO_ROOT_PASSWORD: kcsminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kcs_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: kcs-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 kcsminio kcsminio123;
      mc mb -p local/kcs-assets || true;
      mc anonymous set download local/kcs-assets || true;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kcs-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://kcs:kcs@postgres:5432/kcs
      # Local demo stack: load sample creators / projects / jobs on start. Never set in production.
      KCS_SEED: demo
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: kcs-assets
      S3_ACCESS_KEY: kcsminio
      S3_SECRET_KEY: kcsminio123
      S3_FORCE_PATH_STYLE: "true"
      WEB_ORIGIN: http://localhost:7002,http://localhost:7003,http://localhost:7004,http://localhost:7005
      AUTH_BASE_URL: http://select:7004
      TIKHUB_API_KEY: ""
      TIKHUB_BASE_URL: https://api.tikhub.io
      PGY_ACCESS_TOKEN: ""
      PGY_GATEWAY: tikhub
      PGY_BASE_URL: ""
      PGY_BRAND_USER_ID: ""
      PGY_ENRICH: "0"
      QIANGUA_TOKEN: ""
      QIANGUA_BASE_URL: https://api.qian-gua.com
      QIANGUA_SEARCH_PATH: /v1/xhs/creators/search
      XINHONG_TOKEN: ""
      XINHONG_BASE_URL: https://api.newrank.cn
      XINHONG_SEARCH_PATH: /api/sync/xh/account/search
    ports:
      - "7100:7100"
    profiles:
      - full


  marketing:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workspace-app
      args:
        APP: marketing
    container_name: kcs-marketing
    depends_on:
      - api
    environment:
      NITRO_PORT: "7005"
      NUXT_PUBLIC_API_BASE: http://localhost:7100
      NUXT_PUBLIC_MARKETING_URL: http://localhost:7005
      NUXT_PUBLIC_OPS_URL: http://localhost:7002
      NUXT_PUBLIC_DEV_URL: http://localhost:7003
      NUXT_PUBLIC_SELECT_URL: http://localhost:7004
      DB_DIALECT: pg
      DATABASE_URL: postgres://kcs:kcs@postgres:5432/tinyship
      BETTER_AUTH_SECRET: local-dev-better-auth-secret-change-me
      BETTER_AUTH_URL: http://localhost:7005
      APP_BASE_URL: http://localhost:7005
    ports:
      - "7005:7005"
    profiles:
      - full

  ops:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workspace-app
      args:
        APP: ops
    container_name: kcs-ops
    depends_on:
      - api
    environment:
      NITRO_PORT: "7002"
      NUXT_PUBLIC_API_BASE: http://localhost:7100
      NUXT_PUBLIC_MARKETING_URL: http://localhost:7005
      NUXT_PUBLIC_OPS_URL: http://localhost:7002
      NUXT_PUBLIC_DEV_URL: http://localhost:7003
      NUXT_PUBLIC_SELECT_URL: http://localhost:7004
      DB_DIALECT: pg
      DATABASE_URL: postgres://kcs:kcs@postgres:5432/tinyship
      BETTER_AUTH_SECRET: local-dev-better-auth-secret-change-me
      BETTER_AUTH_URL: http://localhost:7002
      APP_BASE_URL: http://localhost:7002
    ports:
      - "7002:7002"
    profiles:
      - full

  dev:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workspace-app
      args:
        APP: dev
    container_name: kcs-dev
    depends_on:
      - api
    environment:
      NITRO_PORT: "7003"
      NUXT_PUBLIC_API_BASE: http://localhost:7100
      NUXT_PUBLIC_MARKETING_URL: http://localhost:7005
      NUXT_PUBLIC_OPS_URL: http://localhost:7002
      NUXT_PUBLIC_DEV_URL: http://localhost:7003
      NUXT_PUBLIC_SELECT_URL: http://localhost:7004
      DB_DIALECT: pg
      DATABASE_URL: postgres://kcs:kcs@postgres:5432/tinyship
      BETTER_AUTH_SECRET: local-dev-better-auth-secret-change-me
      BETTER_AUTH_URL: http://localhost:7003
      APP_BASE_URL: http://localhost:7003
    ports:
      - "7003:7003"
    profiles:
      - full

  select:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workspace-app
      args:
        APP: select
    container_name: kcs-select
    depends_on:
      - api
    environment:
      NITRO_PORT: "7004"
      NUXT_PUBLIC_API_BASE: http://localhost:7100
      NUXT_PUBLIC_MARKETING_URL: http://localhost:7005
      NUXT_PUBLIC_OPS_URL: http://localhost:7002
      NUXT_PUBLIC_DEV_URL: http://localhost:7003
      NUXT_PUBLIC_SELECT_URL: http://localhost:7004
      DB_DIALECT: pg
      DATABASE_URL: postgres://kcs:kcs@postgres:5432/tinyship
      BETTER_AUTH_SECRET: local-dev-better-auth-secret-change-me
      BETTER_AUTH_URL: http://localhost:7004
      APP_BASE_URL: http://localhost:7004
    ports:
      - "7004:7004"
    profiles:
      - full

volumes:
  kcs_pg:
  kcs_minio:
