# 发布：打 kcs-* 标签触发。构建 arm64 镜像推到 GHCR，并建 GitHub Release。
# 版本号规则见 RELEASING.md；服务器部署用 .env 的 KCS_REGISTRY/KCS_TAG 指到 ghcr 镜像。
name: release

on:
  push:
    tags: ["kcs-*"]

jobs:
  images:
    runs-on: ubuntu-24.04-arm  # 部署目标是 ARM64（t4g），原生构建不做跨架构
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            app: ""
          - service: marketing
            dockerfile: deploy/Dockerfile.workspace-app
            app: marketing
          - service: select
            dockerfile: deploy/Dockerfile.workspace-app
            app: select
          - service: ops
            dockerfile: deploy/Dockerfile.workspace-app
            app: ops
          - service: dev
            dockerfile: deploy/Dockerfile.workspace-app
            app: dev
          - service: tools
            dockerfile: deploy/Dockerfile.tools
            app: ""
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          build-args: |
            APP=${{ matrix.app }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kcs/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kcs/${{ matrix.service }}:release
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release-notes:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建 GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes-start-tag "$(git describe --abbrev=0 --tags '${{ github.ref_name }}^' 2>/dev/null || echo '')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
