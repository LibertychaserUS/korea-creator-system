# CI：每次推送与 PR 跑测试与类型检查。发布走 release.yml（打 kcs-* 标签触发）。
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["kcs-*"]  # 打版本标签时 release.yml 会跑完整构建，这里不重复
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 契约包测试
        run: pnpm --filter @kcs/contract test

      - name: API 测试（重试 2 次吸收两个预存 flake）
        run: pnpm --filter @kcs/api exec vitest run --retry=2

      - name: 前端单元测试与三语一致性
        run: npx vitest run tests/unit

      - name: API 类型检查
        run: pnpm --filter @kcs/api typecheck
