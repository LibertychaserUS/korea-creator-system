name: KCS

# Job names are the required-check names in forge.yaml (branches.main.required_checks).
# Rename a job → update forge.yaml and the branch protection rule together.

on:
  push:
    branches: [main, cursor/ci-kcs-pipeline-d3aa]
  pull_request:
  workflow_dispatch:

concurrency:
  group: kcs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kcs
      - name: Contract unit tests
        run: pnpm --filter @kcs/contract test

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kcs
          POSTGRES_PASSWORD: kcs
          POSTGRES_DB: kcs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kcs -d kcs_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://kcs:kcs@127.0.0.1:5432/kcs_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kcs
      - name: API unit tests (Postgres)
        run: pnpm --filter @kcs/api test

  apps:
    name: apps (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [select, ops, dev, marketing]
    steps:
      - uses: actions/checkout@v4
      # postinstall runs `nuxt prepare` for every app, so .nuxt types exist before typecheck.
      - uses: ./.github/actions/setup-kcs
      - name: Typecheck
        run: pnpm --filter @kcs/app-${{ matrix.app }} typecheck
      - name: Build
        run: pnpm --filter @kcs/app-${{ matrix.app }} build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  blackbox:
    name: blackbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kcs
          POSTGRES_PASSWORD: kcs
          POSTGRES_DB: kcs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kcs -d kcs"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    # Read by scripts/ci/blackbox-up.sh and by the suites (tests/blackbox/.env.example).
    env:
      BLACKBOX_DATABASE_URL: postgres://kcs:kcs@127.0.0.1:5432/kcs
      BLACKBOX_AUTH_DATABASE_URL: postgres://kcs:kcs@127.0.0.1:5432/tinyship
      BLACKBOX_BASE_URL: http://localhost:7100
      BLACKBOX_AUTH_URL: http://localhost:7004
      BLACKBOX_SELECT_URL: http://localhost:7004
      BLACKBOX_MARKETING_URL: http://localhost:7005
      BLACKBOX_OPS_URL: http://localhost:7002
      BLACKBOX_DEV_URL: http://localhost:7003
      BLACKBOX_VENDOR_PORT: '7190'
      BLACKBOX_VENDOR_TOKEN: blackbox-vendor-token
      # select = TinyShip sign-in origin; marketing = role hand-off cases.
      BLACKBOX_APPS: select marketing
      BLACKBOX_BUILD: '1'
      BETTER_AUTH_SECRET: kcs-ci-blackbox-only-secret-not-for-production
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kcs
      - name: Bring up identity DB, apps and API
        run: scripts/ci/blackbox-up.sh
      - name: Black-box suites
        run: pnpm test:blackbox
      - name: Service logs
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/kcs-blackbox/*.log; do
            echo "::group::$(basename "$f")"; tail -n 200 "$f"; echo "::endgroup::"
          done
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-logs
          path: ${{ runner.temp }}/kcs-blackbox/*.log
          retention-days: 7
      - name: Stop services
        if: always()
        run: scripts/ci/blackbox-down.sh

  api-image:
    name: api-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build apps/api/Dockerfile (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          tags: kcs-api:ci
          cache-from: type=gha,scope=kcs-api
          cache-to: type=gha,scope=kcs-api,mode=max
