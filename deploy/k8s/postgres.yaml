apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kcs
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kcs
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: kcs
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kcs-api
                  key: postgres-password
            - name: POSTGRES_DB
              value: kcs
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pg
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pg
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
