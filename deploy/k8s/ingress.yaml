apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kcs
  namespace: kcs
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: kcs.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 7100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 7001
