apiVersion: v1
kind: Secret
metadata:
  name: kcs-api
  namespace: kcs
type: Opaque
stringData:
  postgres-password: change-me
  database-url: postgres://kcs:change-me@postgres:5432/kcs
  s3-access-key: kcsminio
  s3-secret-key: change-me-too
  # 选人池翻页游标的签名密钥；所有 API 副本必须相同（openssl rand -hex 32）
  cursor-secret: change-me-cursor-secret
  # 蒲公英经 TikHub（默认网关）：TikHub 控制台的 API key
  tikhub-api-key: ""
  # 蒲公英走 JustOneAPI / 官方开放平台时的 token（见 PGY_GATEWAY）；旧部署里放 TikHub key 也照常可用
  pgy-access-token: ""
  # 千瓜 / 新红：企业合同开通后由供应商下发
  qiangua-token: ""
  xinhong-token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: kcs-web
  namespace: kcs
type: Opaque
stringData:
  # 四端工作台自己的库（TinyShip 面板：会话 / 用户），与 API 的 kcs 库分开
  database-url: postgres://kcs:change-me@postgres:5432/tinyship
  better-auth-secret: change-me-32-bytes-minimum
