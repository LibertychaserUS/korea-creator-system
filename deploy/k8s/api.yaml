apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kcs
spec:
  ports:
    - port: 7100
  selector:
    app: kcs-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcs-api
  namespace: kcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kcs-api
  template:
    metadata:
      labels:
        app: kcs-api
    spec:
      serviceAccountName: kcs-api
      # SHUTDOWN_TIMEOUT_MS (25 s) must stay below this so the API exits on its own.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: kcs-api:local
          ports:
            - containerPort: 7100
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kcs-api
                  key: database-url
            - name: AUTH_BASE_URL
              value: http://select:7004
            - name: SHUTDOWN_TIMEOUT_MS
              value: "25000"
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_BUCKET
              value: kcs-assets
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kcs-api
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kcs-api
                  key: s3-secret-key
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            # Signs the select pool's page cursors. Every replica needs the same value; without
            # it (and without BETTER_AUTH_SECRET) each process picks a random one at start,
            # so cursors stop working across replicas and after a restart.
            - name: KCS_CURSOR_SECRET
              valueFrom: { secretKeyRef: { name: kcs-api, key: cursor-secret, optional: true } }
            - name: WEB_ORIGIN
              value: https://kcs.example.com,https://legacy.kcs.example.com,https://ops.kcs.example.com,https://dev.kcs.example.com,https://select.kcs.example.com
            # 蒲公英 via TikHub (default gateway). TIKHUB_BASE_URL: https://api.tikhub.io, or
            # https://api.tikhub.dev from mainland China.
            - name: TIKHUB_API_KEY
              valueFrom: { secretKeyRef: { name: kcs-api, key: tikhub-api-key, optional: true } }
            - name: TIKHUB_BASE_URL
              value: https://api.tikhub.io
            # Only for PGY_GATEWAY=justoneapi | official (older deployments may keep a TikHub key here).
            - name: PGY_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: kcs-api, key: pgy-access-token, optional: true } }
            # official | tikhub | justoneapi — all relay the same 蒲公英 solar JSON
            - name: PGY_GATEWAY
              value: tikhub
            # JustOneAPI / official host; empty = the gateway default
            - name: PGY_BASE_URL
              value: ""
            # Daily money cap for 蒲公英 calls (USD); "none" = calls quota only
            - name: PGY_DAILY_BUDGET_USD
              value: "5"
            - name: PGY_BRAND_USER_ID
              value: ""
            # "1" = also pull dataSummary/fansSummary/notesRate/fansProfile per creator on searches (4 billed calls each)
            - name: PGY_ENRICH
              value: "0"
            - name: QIANGUA_TOKEN
              valueFrom: { secretKeyRef: { name: kcs-api, key: qiangua-token } }
            - name: QIANGUA_BASE_URL
              value: https://api.qian-gua.com
            - name: QIANGUA_SEARCH_PATH
              value: /v1/xhs/creators/search
            - name: XINHONG_TOKEN
              valueFrom: { secretKeyRef: { name: kcs-api, key: xinhong-token } }
            - name: XINHONG_BASE_URL
              value: https://api.newrank.cn
            - name: XINHONG_SEARCH_PATH
              value: /api/sync/xh/account/search
          # Readiness runs `select 1` and turns 503 while shutting down; liveness never touches
          # the DB, so a database outage takes pods out of rotation instead of restarting them.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 7100
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 7100
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
