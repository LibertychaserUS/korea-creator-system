apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kcs
spec:
  ports:
    - port: 7100
  selector:
    app: kcs-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcs-api
  namespace: kcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kcs-api
  template:
    metadata:
      labels:
        app: kcs-api
    spec:
      serviceAccountName: kcs-api
      containers:
        - name: api
          image: kcs-api:local
          ports:
            - containerPort: 7100
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kcs-api
                  key: database-url
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_BUCKET
              value: kcs-assets
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kcs-api
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kcs-api
                  key: s3-secret-key
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: WEB_ORIGIN
              value: https://kcs.example.com,https://legacy.kcs.example.com,https://ops.kcs.example.com,https://dev.kcs.example.com,https://select.kcs.example.com
            - name: PGY_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: kcs-api, key: pgy-access-token } }
            # official | tikhub | justoneapi — all relay the same 蒲公英 solar JSON
            - name: PGY_GATEWAY
              value: tikhub
            # leave empty to use the gateway default host; set for the official OpenAPI host
            - name: PGY_BASE_URL
              value: ""
            - name: PGY_BRAND_USER_ID
              value: ""
            # "1" = also pull dataSummary/fansSummary/notesRate/fansProfile per creator on searches (4 billed calls each)
            - name: PGY_ENRICH
              value: "0"
            - name: QIANGUA_TOKEN
              valueFrom: { secretKeyRef: { name: kcs-api, key: qiangua-token } }
            - name: QIANGUA_BASE_URL
              value: https://api.qian-gua.com
            - name: QIANGUA_SEARCH_PATH
              value: /v1/xhs/creators/search
            - name: XINHONG_TOKEN
              valueFrom: { secretKeyRef: { name: kcs-api, key: xinhong-token } }
            - name: XINHONG_BASE_URL
              value: https://api.newrank.cn
            - name: XINHONG_SEARCH_PATH
              value: /api/sync/xh/account/search
          readinessProbe:
            httpGet:
              path: /api/health
              port: 7100
