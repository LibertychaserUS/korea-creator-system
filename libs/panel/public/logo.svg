<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="听潮">
  <defs>
    <linearGradient id="tide-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e7285"/>
      <stop offset="1" stop-color="#0d3547"/>
    </linearGradient>
  </defs>
  <!-- 深海徽章底 -->
  <rect width="48" height="48" rx="11" fill="url(#tide-badge)"/>
  <!-- 声纹：在听的三根柱，高矮递进 -->
  <g fill="#cfeef0">
    <rect x="11.5" y="19" width="3.4" height="10" rx="1.7" opacity="0.55"/>
    <rect x="18" y="13.5" width="3.4" height="21" rx="1.7"/>
    <rect x="24.5" y="16.5" width="3.4" height="15" rx="1.7" opacity="0.8"/>
    <rect x="31" y="21" width="3.4" height="6" rx="1.7" opacity="0.5"/>
  </g>
  <!-- 潮线：一条涌浪自左向右推进，收在声纹之下 -->
  <path d="M7.5 38.5c4.6-3 8.2-3 12.8 0 4.6 3 8.2 3 12.8 0 2.3-1.5 4.6-2.3 7.4-2.3"
        fill="none" stroke="#eafaf7" stroke-width="2.6" stroke-linecap="round"/>
</svg>
