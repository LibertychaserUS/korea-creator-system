# Thin Forge config. Pin: LibertychaserUS/AIOps forge-v1.1.1 (same tree as overlay-v2.0.0).
# Do not vendor forge/. Do not live-apply.
schema: forge-config/v1
protect:
  - main
agent_branch_prefixes:
  - feature/
  - fix/
  - ui/
  - docs/
  - cursor/
deny_paths:
  - archive/**
branches:
  main:
    # Job names in .github/workflows/kcs.yml, exactly as the PR page shows them.
    required_checks:
      - contract
      - api
      - apps (select)
      - apps (ops)
      - apps (dev)
      - apps (marketing)
      - blackbox
      - api-image
      - i18n
    approvals: 1
    code_owners: false
docs_sync: []
forbidden_live_repos: []
